name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Job name is the required status check on `main`. The release workflow's job of
  # the same name only runs on push, so a pull request would otherwise wait forever
  # on a check that can never report. Keep both names in sync with branch protection.
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run build && npx electron-builder --publish never --win nsis --x64
